    <script>
      // Browser Extension Compatibility Patch:
      // Certain Chrome extensions (such as Similarweb, ad-blockers, or SEO trackers) attempt to monkey-patch
      // window.fetch using direct assignment (window.fetch = ...), which throws a TypeError in environments
      // where Window.prototype.fetch only provides a getter.
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var _origFetch = window.fetch.bind(window);
            var _currentFetch = _origFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              }
            });
          }
        } catch (e) {
          // If property cannot be redefined, proceed without breaking
        }

        // Isolate external extension errors (e.g., from chrome-extension://) so they do not crash the app
        window.addEventListener('error', function(event) {
          var isExtensionError = (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event && event.error && event.error.stack && (event.error.stack.indexOf('chrome-extension://') !== -1 || event.error.stack.indexOf('moz-extension://') !== -1));
          if (isExtensionError) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);
      })();
    </script>
